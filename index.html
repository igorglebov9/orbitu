<style>
  :root { --bg: #fbfbfd; --text: #1d1d24; --muted: #5c5c6b; --accent: #4b46c8; }

    :root { --bg: #0f1020; --text: #e8e8f2; --muted: #a2a2b8; --accent: #a9a6ff; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Orbitu</h1>
  <p>A habit tracker where every habit grows into a planet in your night sky — and graduates
